[package]
name = "RoundTable"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "圆桌"
readme = "README.md"
license = "GPL-3.0-only"

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["wgpu"] }
raw-window-handle = "0.6"
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 16
opt-level = 3
strip = true
